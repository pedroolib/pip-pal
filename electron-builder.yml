appId: mx.pip.app
productName: Pip
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  # Includes resources/models: run `npm run fetch:whisper` before packaging.
  - resources/**
win:
  executableName: pip-pal
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# Unsigned, for the demo Mac (Apple Silicon). Pip uses the microphone and computer audio for voice
# capture, but no camera or folders, so the template's prompts for those are gone (docs/DECISIONS.md, notes for A).
mac:
  target:
    - target: dmg
      arch: arm64
  # Ad-hoc signature: no Apple account needed, and the whole bundle is sealed so macOS can keep
  # its Accessibility permission. Hardened runtime would refuse ad-hoc-signed Electron frameworks.
  identity: '-'
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # The hotkey presses ⌘C through System Events (src/main/capture.ts); macOS asks once.
    NSAppleEventsUsageDescription: Pip copies the text you selected when you press Control+Shift+Space.
    NSMicrophoneUsageDescription: Pip listens only after you press Start, to write down spoken instructions on this computer.
    NSAudioCaptureUsageDescription: Pip can listen to your computer's audio, only after you choose it and press Start. Nothing leaves this computer.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
